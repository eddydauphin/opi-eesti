name: Build Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk opi-eesti.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: opi-eesti-apk
          path: opi-eesti.apk
          if-no-files-found: error

      # Every push to main refreshes a rolling "latest" release, so the newest
      # APK always has the same direct download link.
      - name: Move the "latest" tag to this commit
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish rolling "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          body: |
            Newest build from `main` (commit ${{ github.sha }}).
            Download `opi-eesti.apk` on the phone, open it and allow the install.
          files: opi-eesti.apk

      - name: Attach APK to a versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: opi-eesti.apk
